name: Publish Packages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build packages
        run: npm run build

  publish:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: verify

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - package: calc-core
            path: packages/calc-core
          - package: calc-utils
            path: packages/calc-utils

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24 for GitHub Packages
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://npm.pkg.github.com
          scope: '@bonham'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Publish package
        working-directory: ${{ matrix.path }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
